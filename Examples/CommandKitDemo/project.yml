name: CommandKitDemo

options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  MacMenuBarCommandKit:
    path: ../..

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
    SWIFT_VERSION: "6.0"
    COMMANDKIT_BUNDLE_ID: dev.liquidglasstemplates.commandkit.demo

targets:
  CommandKitDemo:
    type: application
    platform: macOS
    sources:
      - path: CommandKitDemo
    dependencies:
      - package: MacMenuBarCommandKit
        product: MacMenuBarCommandKit
    info:
      path: CommandKitDemo/Info.plist
      properties:
        CFBundleDisplayName: CommandKit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CommandKitDemo/Info.plist
        MARKETING_VERSION: "0.3.0"
        PRODUCT_BUNDLE_IDENTIFIER: "$(COMMANDKIT_BUNDLE_ID)"
        PRODUCT_NAME: "$(TARGET_NAME)"
  CommandKitDemoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CommandKitDemoTests
    dependencies:
      - target: CommandKitDemo
      - package: MacMenuBarCommandKit
        product: MacMenuBarCommandKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(COMMANDKIT_BUNDLE_ID).modeltests"
  CommandKitDemoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: CommandKitDemoUITests
    dependencies:
      - target: CommandKitDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(COMMANDKIT_BUNDLE_ID).uitests"

schemes:
  CommandKitDemo:
    build:
      targets:
        CommandKitDemo: all
    test:
      gatherCoverageData: true
      targets:
        - CommandKitDemoTests
        - CommandKitDemoUITests
