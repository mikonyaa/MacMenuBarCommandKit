name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "codex/quality-rc-*"
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      native_ui:
        description: "Attempt native XCUI journeys (requires an authenticated GUI session)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_PROJECT: Examples/CommandKitDemo/CommandKitDemo.xcodeproj
  DEMO_SCHEME: CommandKitDemo
  DEMO_DESTINATION: "platform=macOS"

jobs:
  validate:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compatibility
            runner: macos-15
            developer_dir: /Applications/Xcode_16.4.app/Contents/Developer
          - name: current
            runner: macos-26
            developer_dir: /Applications/Xcode_26.5.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate bare SemVer release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
      - name: Install hash-verified tools
        run: bash Tools/install_ci_tools.sh "$RUNNER_TEMP/commandkit-tools"
      - name: Log actual toolchain and provenance
        run: |
          git rev-parse HEAD
          sw_vers
          swift --version
          xcodebuild -version
          xcodegen --version
          swiftlint version
      - name: Test public package
        run: swift test
      - name: Lint
        run: swiftlint lint --strict
      - name: Build demo at macOS 14 minimum
        run: |
          xcodebuild -project "$DEMO_PROJECT" -scheme "$DEMO_SCHEME" \
            -destination "$DEMO_DESTINATION" -derivedDataPath "$RUNNER_TEMP/CommandKitDerivedData" \
            COMMANDKIT_BUNDLE_ID="dev.liquidglasstemplates.commandkit.ci.$GITHUB_RUN_ID" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test demo models using owned fixtures
        run: |
          xcodebuild -project "$DEMO_PROJECT" -scheme "$DEMO_SCHEME" \
            -destination "$DEMO_DESTINATION" -derivedDataPath "$RUNNER_TEMP/CommandKitDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/DemoModels.xcresult" \
            -only-testing:CommandKitDemoTests \
            COMMANDKIT_BUNDLE_ID="dev.liquidglasstemplates.commandkit.ci.$GITHUB_RUN_ID" \
            CODE_SIGNING_ALLOWED=NO test
      - name: External consumer build and hosted native regressions
        run: |
          python3 Tools/prepare_consumer.py --local "$PWD" --output "$RUNNER_TEMP/independent-consumer"
          mkdir -p "$RUNNER_TEMP/consumer-captures"
          cd "$RUNNER_TEMP/independent-consumer"
          swift package resolve
          swift build
          CONSUMER_CAPTURE_DIR="$RUNNER_TEMP/consumer-captures" swift test
      - name: Safe run-script negative fixtures
        run: |
          bash -n script/build_and_run.sh
          zsh -n Scripts/record_showcase.sh
          bash -n Scripts/capture_rc.sh
          python3 Tools/test_run_script.py
      - name: Reproduce checked-in project twice
        if: matrix.name == 'current'
        run: |
          cd Examples/CommandKitDemo
          xcodegen generate
          xcodegen generate
          cd ../..
          git diff --exit-code -- Examples/CommandKitDemo/CommandKitDemo.xcodeproj/project.pbxproj
      - name: Check local documentation links and repository hygiene
        if: matrix.name == 'current'
        run: |
          ruby -e 'Dir["**/*.md"].each { |file| File.read(file).scan(/\[[^\]]*\]\(([^)]+)\)/).flatten.each { |link| next if link.start_with?("http", "#", "mailto:"); path = link.split("#", 2).first.delete_prefix("<").delete_suffix(">"); next if path.empty?; abort("Missing #{path} from #{file}") unless File.exist?(File.expand_path(path, File.dirname(file))) } }'
          if git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|xcuserdata|DerivedData|\.build)(/|$)|\.(xcuserstate|xccheckout)$'; then exit 1; fi
          git diff --check
      - name: Optional native XCUI journeys
        if: github.event_name == 'workflow_dispatch' && inputs.native_ui && matrix.name == 'current'
        run: |
          xcodebuild -project "$DEMO_PROJECT" -scheme "$DEMO_SCHEME" \
            -destination "$DEMO_DESTINATION" -derivedDataPath "$RUNNER_TEMP/CommandKitDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/NativeUI.xcresult" \
            -only-testing:CommandKitDemoUITests \
            COMMANDKIT_BUNDLE_ID="dev.liquidglasstemplates.commandkit.ci.$GITHUB_RUN_ID" \
            CODE_SIGNING_ALLOWED=NO test
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-evidence-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/DemoModels.xcresult
            ${{ runner.temp }}/NativeUI.xcresult
            ${{ runner.temp }}/consumer-captures
          if-no-files-found: ignore
