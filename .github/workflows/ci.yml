name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Test package
        run: swift test

  demo:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build demo
        run: |
          xcodebuild \
            -project Examples/CommandKitDemo/CommandKitDemo.xcodeproj \
            -scheme CommandKitDemo \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
